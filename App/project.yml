name: Player
options:
  bundleIdPrefix: de.haskoman
  deploymentTarget:
    tvOS: "18.0"
packages:
  # AetherEngine 7.71.2 (exact version) through the local wrapper with the trait DolbyVisionFelCurves (Dolby Vision FEL):
  # XcodeGen drops `traits:`, so Packages/AetherFEL/Package.swift sets the trait and re-exports the engine.
  AetherFEL:
    path: ../Packages/AetherFEL
  PlayerCore:
    path: ../Packages/PlayerCore
targets:
  Player:
    type: application
    platform: tvOS
    sources:
      - Sources
      # SFace face model (X-Ray), generated in CI by tools/xray_model/convert_sface.py and never committed.
      # Xcode compiles the .mlpackage to SFace.mlmodelc in the app bundle. Optional: missing outside CI.
      - path: Resources/SFace.mlpackage
        type: file
        buildPhase: sources
        optional: true
    dependencies:
      - package: AetherFEL
      - package: PlayerCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Player
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PlayerBuildCommit: "$(PLAYER_BUILD_COMMIT)"
        PlayerBuildBranch: "$(PLAYER_BUILD_BRANCH)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSBonjourServices: ["_playerlog._tcp", "_workstation._tcp"]
        NSLocalNetworkUsageDescription: "Für die Handy-Eingabeseite und Addons im Heimnetz (z. B. AIOStreams auf dem Pi)."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.haskoman.player
        SWIFT_VERSION: "5.0"
        # Build number/commit/branch: 1 or empty for local builds; CI sets the run number, commit and branch (build.yml).
        CURRENT_PROJECT_VERSION: "1"
        PLAYER_BUILD_COMMIT: ""
        PLAYER_BUILD_BRANCH: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
