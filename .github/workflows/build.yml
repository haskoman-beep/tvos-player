name: build-ipa
on:
  push:
    paths: ['App/**', 'Packages/**', '.github/workflows/**', 'tools/release_notes.sh', 'tools/check_ipa.sh']
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: "Version history: only print the release notes, publish nothing"
        type: boolean
        default: false
# Standard nur lesen; Schreibrecht bekommen allein die Jobs „release“ und „history“.
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # Aktionen auf Commit festgelegt (Tag als Kommentar; dieselben Stände wie zuvor @v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          ls /Applications | grep -i xcode
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app /Applications/Xcode_26.3*.app 2>/dev/null | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos
      - name: XcodeGen
        run: brew install xcodegen && cd App && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          # Build-Nummer = Laufnummer; Commit/Branch für „App aktualisieren“ in den Einstellungen.
          cd App && xcodebuild -project Player.xcodeproj -scheme Player -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PLAYER_BUILD_COMMIT="$GITHUB_SHA" PLAYER_BUILD_BRANCH="$GITHUB_REF_NAME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || { grep -E 'error:|BUILD FAILED' build.log | head -80; exit 1; }
          tail -5 build.log
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' -c 'Print :PlayerBuildCommit' -c 'Print :PlayerBuildBranch' build/Build/Products/Release-appletvos/Player.app/Info.plist
      - name: Nachweis Dolby Vision FEL
        # Packages/AetherFEL schaltet den Engine-Trait DolbyVisionFelCurves ein. Harte Prüfung ist dort der
        # Bauwächter FelBuildGuard.swift (ohne Trait kein FelCurveFoldResult, der Bau bricht ab); hier zusätzlich
        # der Nachweis im Bau-Log: Wächter übersetzt und die Trait-Bedingung im Compileraufruf der Engine.
        run: |
          cd App
          guard=$(grep -c 'FelBuildGuard.swift' build.log || true)
          flag=$(grep -o -E -- '-D ?DolbyVisionFelCurves' build.log | sort | uniq -c | sed 's/^ *//' | tr '\n' ' ' | sed 's/ *$//' || true)
          any=$(grep -c 'DolbyVisionFelCurves' build.log || true)
          echo "FelBuildGuard.swift im Log: ${guard} · Trait-Bedingung: ${flag:-keine} · Trait-Name gesamt: ${any}"
          # Xcode 26.3 schreibt die Bedingung als -DDolbyVisionFelCurves in die Compileraufrufe der Engine (Lauf 44940934903: 3×).
          if [ "$guard" -eq 0 ]; then echo "::error title=FEL::Bauwächter FelBuildGuard.swift nicht im Build-Log"; exit 1; fi
          if [ -z "$flag" ]; then echo "::error title=FEL::Trait-Bedingung -DDolbyVisionFelCurves nicht im Build-Log"; exit 1; fi
          echo "::notice title=FEL::DolbyVisionFelCurves im Build (Wächter ${guard}x, Bedingung: ${flag})"
      - name: Kein direkter Engine-Import
        # Die App importiert die Engine nur über Packages/AetherFEL (dort ist der FEL-Trait gesetzt).
        run: |
          if grep -rn '^import AetherEngine' App/Sources; then echo "::error::Direkter 'import AetherEngine' in App/Sources – bitte 'import AetherFEL'"; exit 1; fi
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R App/build/Build/Products/Release-appletvos/Player.app Payload/
          zip -qry Player.ipa Payload
          ls -la Player.ipa
      - name: App-Inhalt prüfen
        # Engine-Frameworks (FFmpeg, zvbi, dav1d, zimg aus FFmpegBuild) und das Ressourcen-Bündel der Engine.
        run: |
          app=Payload/Player.app
          ls "$app/Frameworks" || true
          ls -d "$app"/*.bundle || true
          missing=0
          for f in avcodec avformat avutil swresample swscale avfilter zvbi dav1d zimg; do
            [ -d "$app/Frameworks/AetherLib$f.framework" ] || { echo "::error::Framework AetherLib$f.framework fehlt in $app/Frameworks"; missing=1; }
          done
          [ -d "$app/AetherEngine_AetherEngine.bundle" ] || { echo "::error::Ressourcen-Bündel AetherEngine_AetherEngine.bundle fehlt in $app"; missing=1; }
          exit $missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: build-log
          path: App/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Player-ipa
          path: Player.ipa
          retention-days: 14
  release:
    # Öffentliches Release „app-main“ mit Player.ipa (nur main): atvloadly lädt es ohne Anmeldung,
    # (nicht „Latest“: das ist das nummerierte Release build-<N> aus dem Job „history“);
    # das Artefakt „Player-ipa“ dagegen braucht eine Anmeldung und ist gezippt.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-app-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Player-ipa
      - name: Release app-main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la Player.ipa
          # Erste Zeile bleibt das Format, das die App liest (Build/Commit); die Lizenzzeile steht dahinter.
          notes="Build $GITHUB_RUN_NUMBER · Commit $GITHUB_SHA · Branch main"
          notes="$notes"$'\n\n'"Lizenzen und Quellen der mitgelieferten Komponenten (AetherEngine, FFmpeg, libdovi, Anime4K u. a.): https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/THIRD_PARTY_NOTICES.md"
          title="Player Build $GITHUB_RUN_NUMBER"
          if old=$(gh release view app-main --json body --jq .body 2>/dev/null); then
            prev=$(printf '%s\n' "$old" | sed -n 's/.*Build \([0-9][0-9]*\).*/\1/p' | head -1)
            if [ -n "$prev" ] && [ "$prev" -ge "$GITHUB_RUN_NUMBER" ]; then
              echo "Release hat schon Build $prev – nichts zu tun"
              exit 0
            fi
            # Erst der Text, dann das Paket: die Build-Nummer im Text hinkt dem Paket nie hinterher.
            gh release edit app-main --title "$title" --notes "$notes"
            gh release upload app-main Player.ipa --clobber
            echo "move_tag=true" >> "$GITHUB_OUTPUT"
          else
            gh release create app-main Player.ipa --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest=false
          fi
      - name: Tag app-main nachziehen
        if: steps.release.outputs.move_tag == 'true'
        # Darf scheitern: GITHUB_TOKEN darf Refs nicht immer ändern (z. B. wenn der Lauf den Workflow selbst
        # geändert hat). Die App liest Build und Commit aus dem Release-Text, nicht aus dem Tag.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PATCH "repos/$GH_REPO/git/refs/tags/app-main" -f sha="$GITHUB_SHA" -F force=true > /dev/null
  history:
    # Versionsverlauf: ein GitHub-Release je Build, Tag build-<Laufnummer> (= CFBundleVersion in der App),
    # mit Player.ipa. integ → Vorabversion (prerelease), main → Release („Latest“). Andere Branches und
    # workflow_dispatch mit release_dry_run: Probelauf, die Notizen stehen nur in der Job-Zusammenfassung.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-history-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Player-ipa
      - name: Modus
        id: mode
        env:
          DRY: ${{ inputs.release_dry_run }}
        run: |
          mode=dry-run
          case "$GITHUB_REF" in refs/heads/integ|refs/heads/main) mode=publish ;; esac
          [ "$DRY" = true ] && mode=dry-run
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Modus: $mode (Ref $GITHUB_REF, Ereignis $GITHUB_EVENT_NAME)"
      - name: IPA prüfen (keine Schlüssel, Adressen, Namen)
        env:
          EXTRA_DENY: ${{ secrets.IPA_DENYLIST }}
        run: bash tools/check_ipa.sh Player.ipa
      - name: Release-Notizen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          bash tools/release_notes.sh "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > notes.md
          { echo "## Version history: build-$GITHUB_RUN_NUMBER (${{ steps.mode.outputs.mode }})"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
          cat notes.md
      - name: Release build-N
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          # Wiederholter Lauf (gleiche Laufnummer): Release steht schon, nichts zu tun.
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag existiert schon"; exit 0; fi
          if [ "$GITHUB_REF_NAME" = main ]; then
            flags=(--latest); title="Player build $GITHUB_RUN_NUMBER"
          else
            flags=(--prerelease --latest=false); title="Player build $GITHUB_RUN_NUMBER (integ)"
          fi
          if ! gh release create "$tag" Player.ipa --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"; then
            # GITHUB_TOKEN darf manche Refs nicht anlegen (z. B. wenn der Lauf den Workflow selbst geändert hat).
            # Der Build ist in Ordnung; das Release lässt sich lokal nachtragen.
            echo "::warning title=Release::$tag nicht angelegt – lokal nachtragen: tools/backfill_releases.sh $GITHUB_RUN_ID"
            echo "**$tag not created** – add it locally: \`tools/backfill_releases.sh $GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          fi
