name: build-ipa
on:
  push:
    # Branches only: tags (build-N, also from the backfill) do not start a run; paths does not apply to tag pushes.
    branches: ['**']
    paths: ['App/**', 'Packages/**', '.github/workflows/**', 'tools/release_notes.sh', 'tools/check_ipa.sh', 'tools/check_tokens.sh', 'tools/token_allowlist.txt', 'tools/xray_model/**']
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: "Version history: only print the release notes, publish nothing"
        type: boolean
        default: false
# Read-only by default; only the jobs "release" (app-main) and "publish" (build-N) get write access,
# only on main or integ/main, and only after the IPA check in the job "history".
permissions:
  contents: read
jobs:
  test:
    name: Core tests (PlayerCore)
    # PlayerCore tests on Linux in the same Swift image as the local runs; "build" (and so every release) waits for it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned to the multi-arch index digest of swift:6.2 (6.2.4, 2026-11-20) like the actions below; local runs use
    # the same tag. Update tag and digest together.
    container: swift:6.2@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Task 5.5 (D-3): no `.font(.system(size:` and no `Color(red:` outside App/Sources/Views/Design/. Files the
      # later Build 5 tasks still convert are listed in tools/token_allowlist.txt (stale lines only warn).
      - name: Design tokens
        run: bash tools/check_tokens.sh
      - name: swift test
        run: cd Packages/PlayerCore && swift test
  build:
    name: Build IPA
    needs: test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # Actions pinned to a commit (tag as a comment; the same versions as the earlier @v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app /Applications/Xcode_26.3*.app 2>/dev/null | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos
      # Face model for X-Ray (SFace, OpenCV Zoo, Apache-2.0): downloaded and converted to Core ML fp16 here in CI
      # only, never committed (.gitignore). Cached by the script/requirements hash plus the pinned ONNX SHA-256.
      # Must run before XcodeGen: project.yml lists App/Resources/SFace.mlpackage (Xcode compiles it to .mlmodelc).
      - name: Face model cache key
        id: sface
        run: |
          sha=$(sed -n 's/^ONNX_SHA256 = "\([0-9a-f]*\)"$/\1/p' tools/xray_model/convert_sface.py)
          [ -n "$sha" ] || { echo "::error title=SFace::ONNX_SHA256 not found in convert_sface.py"; exit 1; }
          echo "ONNX SHA-256: $sha"
          echo "onnx_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Face model cache
        id: sface-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: App/Resources/SFace.mlpackage
          key: sface-coreml-${{ hashFiles('tools/xray_model/**') }}-${{ steps.sface.outputs.onnx_sha }}
      - name: Set up Python (face model)
        if: steps.sface-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Face model (SFace, convert and check)
        if: steps.sface-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/sface-venv"
          . "$RUNNER_TEMP/sface-venv/bin/activate"
          # Full lock with hashes (every package, no resolution): see tools/xray_model/requirements.lock.
          python -m pip install --quiet --require-hashes --no-deps --only-binary=:all: -r tools/xray_model/requirements.lock
          python -m pip check
          python -m pip freeze
          python -I tools/xray_model/convert_sface.py --out App/Resources/SFace.mlpackage --work "$RUNNER_TEMP/sface"
      - name: Face model present
        run: |
          m=App/Resources/SFace.mlpackage
          [ -f "$m/Manifest.json" ] || { echo "::error title=SFace::$m missing (cache hit: ${{ steps.sface-cache.outputs.cache-hit }})"; exit 1; }
          echo "cache hit: ${{ steps.sface-cache.outputs.cache-hit }}"
          find "$m" -type f -exec ls -l {} \;
      - name: Install XcodeGen (pinned release)
        # Fixed release archive with a SHA-256 checked here instead of "brew install" (moving formula).
        env:
          XCODEGEN_VERSION: '2.48.0'
          XCODEGEN_SHA256: '620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project (XcodeGen)
        run: |
          cd App && xcodegen --version && xcodegen generate
          # The generated project resolves packages itself and ignores the Package.resolved of the local package
          # AetherFEL; copy the checked-in pins there so the build can only use these versions.
          d=Player.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$d" && cp ../Packages/AetherFEL/Package.resolved "$d/Package.resolved"
      - name: Build
        run: |
          set -o pipefail
          # Build number = run number; commit and branch for "update app" (App aktualisieren) in the settings.
          cd App && xcodebuild -project Player.xcodeproj -scheme Player -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build -onlyUsePackageVersionsFromResolvedFile \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PLAYER_BUILD_COMMIT="$GITHUB_SHA" PLAYER_BUILD_BRANCH="$GITHUB_REF_NAME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || { grep -E 'error:|BUILD FAILED' build.log | head -80; exit 1; }
          tail -5 build.log
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' -c 'Print :PlayerBuildCommit' -c 'Print :PlayerBuildBranch' build/Build/Products/Release-appletvos/Player.app/Info.plist
      - name: Concurrency warnings
        # Phase 0a.1: the app target builds with SWIFT_STRICT_CONCURRENCY=complete (App/project.yml) as a diagnostic.
        # This step only makes the compiler's warnings visible (summary + concurrency-warnings.txt); it never fails.
        if: always()
        run: |
          cd App
          [ -f build.log ] || { echo "no build.log"; exit 0; }
          grep -E '/App/Sources/[^ ]*\.swift:[0-9]+:[0-9]+: warning: ' build.log | sed -E 's|^.*/App/Sources/||' | sort -u > all-warnings.txt || true
          grep -i -E 'actor|sendable|concurren|data race|isolat|nonisolated|capture of|mutation of captured' all-warnings.txt > concurrency-warnings.txt || true
          total=$(wc -l < all-warnings.txt | tr -d ' '); conc=$(wc -l < concurrency-warnings.txt | tr -d ' ')
          {
            echo "## Concurrency warnings (app target, diagnostic)"
            echo
            echo "Compiler warnings in App/Sources: ${total} · about concurrency: ${conc}"
            echo
            echo "### By file"
            echo '```'
            cut -d: -f1 concurrency-warnings.txt | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo "### AppModel and storage (first 60)"
            echo '```'
            grep -E '^(AppModel|Playback/PlayerMemory|.*Store)' concurrency-warnings.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Concurrency::${conc} concurrency warnings in App/Sources (of ${total} warnings)"
      - name: Verify Dolby Vision FEL
        # Packages/AetherFEL enables the engine trait DolbyVisionFelCurves. The hard check is the build guard
        # FelBuildGuard.swift there (without the trait there is no FelCurveFoldResult and the build fails); this step
        # also proves it in the build log: the guard was compiled and the trait condition is in the engine's compiler calls.
        run: |
          cd App
          guard=$(grep -c 'FelBuildGuard.swift' build.log || true)
          flag=$(grep -o -E -- '-D ?DolbyVisionFelCurves' build.log | sort | uniq -c | sed 's/^ *//' | tr '\n' ' ' | sed 's/ *$//' || true)
          any=$(grep -c 'DolbyVisionFelCurves' build.log || true)
          echo "FelBuildGuard.swift in log: ${guard} · trait condition: ${flag:-none} · trait name total: ${any}"
          # Xcode 26.3 writes the condition as -DDolbyVisionFelCurves into the engine's compiler calls (run 44940934903: 3×).
          if [ "$guard" -eq 0 ]; then echo "::error title=FEL::Build guard FelBuildGuard.swift not in the build log"; exit 1; fi
          if [ -z "$flag" ]; then echo "::error title=FEL::Trait condition -DDolbyVisionFelCurves not in the build log"; exit 1; fi
          echo "::notice title=FEL::DolbyVisionFelCurves is in the build (guard ${guard}x, condition: ${flag})"
          # Wave X0: DolbyVisionStillReshaping (Profile 5 stills) is set in the same wrapper; it has no public type to guard on.
          still=$(grep -o -E -- '-D ?DolbyVisionStillReshaping' build.log | sort | uniq -c | sed 's/^ *//' | tr '\n' ' ' | sed 's/ *$//' || true)
          if [ -z "$still" ]; then echo "::error title=DV P5::Trait condition -DDolbyVisionStillReshaping not in the build log"; exit 1; fi
          echo "::notice title=DV P5::DolbyVisionStillReshaping is in the build (condition: ${still})"
      - name: No direct engine import
        # The app imports the engine only through Packages/AetherFEL (which sets the FEL trait).
        run: |
          if grep -rn '^import AetherEngine' App/Sources; then echo "::error::Direct 'import AetherEngine' in App/Sources - use 'import AetherFEL'"; exit 1; fi
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R App/build/Build/Products/Release-appletvos/Player.app Payload/
          zip -qry Player.ipa Payload
          ls -la Player.ipa
      - name: Check app contents
        # Engine frameworks (FFmpeg, zvbi, dav1d, zimg from FFmpegBuild) and the engine's resource bundle.
        run: |
          app=Payload/Player.app
          ls "$app/Frameworks" || true
          ls -d "$app"/*.bundle || true
          missing=0
          for f in avcodec avformat avutil swresample swscale avfilter zvbi dav1d zimg; do
            [ -d "$app/Frameworks/AetherLib$f.framework" ] || { echo "::error::Framework AetherLib$f.framework missing in $app/Frameworks"; missing=1; }
          done
          [ -d "$app/AetherEngine_AetherEngine.bundle" ] || { echo "::error::Resource bundle AetherEngine_AetherEngine.bundle missing in $app"; missing=1; }
          # Compiled face model (from App/Resources/SFace.mlpackage), checked inside the zipped IPA.
          unzip -l Player.ipa | grep -E 'Payload/Player\.app/SFace\.mlmodelc/' || true
          for f in coremldata.bin model.mil weights/weight.bin; do
            unzip -l Player.ipa | awk -v p="Payload/Player.app/SFace.mlmodelc/$f" '$4 == p {ok=1} END {exit !ok}' \
              || { echo "::error::SFace.mlmodelc/$f missing in Player.ipa"; missing=1; }
          done
          wsize=$(unzip -l Player.ipa | awk '$4 == "Payload/Player.app/SFace.mlmodelc/weights/weight.bin" {print $1}')
          echo "SFace weight.bin: ${wsize:-0} bytes"
          [ "${wsize:-0}" -ge 15000000 ] || { echo "::error::SFace weight.bin too small (${wsize:-0} bytes)"; missing=1; }
          exit $missing
      - name: Upload build log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: build-log
          path: App/build.log
      - name: Upload concurrency warnings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: concurrency-warnings
          path: |
            App/concurrency-warnings.txt
            App/all-warnings.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Player-ipa
          path: Player.ipa
          retention-days: 14
  release:
    name: Release app-main
    # Public release "app-main" with Player.ipa (main only): atvloadly downloads it without logging in
    # (not "Latest": that is the numbered release build-<N> from the job "publish");
    # the artifact "Player-ipa", in contrast, needs a login and is zipped.
    # Only after the IPA check in the job "history" (if it fails, nothing is published).
    needs: [build, history]
    if: github.ref == 'refs/heads/main' && needs.history.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-app-main
      cancel-in-progress: false
    steps:
      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Player-ipa
      - name: Release app-main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la Player.ipa
          # SHA-256 of exactly the file uploaded below; the app shows it before installing (it cannot check it,
          # because atvloadly downloads the package itself).
          sha256=$(sha256sum Player.ipa | cut -d' ' -f1)
          [ "${#sha256}" -eq 64 ] || { echo "::error::SHA-256 of Player.ipa missing"; exit 1; }
          # The first line keeps the format the app reads (build/commit/hash); the license line comes after it.
          notes="Build $GITHUB_RUN_NUMBER · Commit $GITHUB_SHA · Branch main · SHA256 $sha256"
          notes="$notes"$'\n\n'"Licenses and sources of the bundled components (AetherEngine, FFmpeg, libdovi, Anime4K and others): https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/THIRD_PARTY_NOTICES.md"
          title="Player Build $GITHUB_RUN_NUMBER"
          if old=$(gh release view app-main --json body --jq .body 2>/dev/null); then
            prev=$(printf '%s\n' "$old" | sed -n 's/.*Build \([0-9][0-9]*\).*/\1/p' | head -1)
            if [ -n "$prev" ] && [ "$prev" -ge "$GITHUB_RUN_NUMBER" ]; then
              echo "Release already has build $prev - nothing to do"
              exit 0
            fi
            # Package first, then the text: a failed upload never advertises build N with the new hash. If the edit
            # fails after the upload, the old text stays and its hash no longer matches, so the app shows a mismatch
            # instead of a wrong "verified" build; the next run repairs it.
            gh release upload app-main Player.ipa --clobber
            gh release edit app-main --title "$title" --notes "$notes"
            echo "move_tag=true" >> "$GITHUB_OUTPUT"
          else
            gh release create app-main Player.ipa --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest=false
          fi
      - name: Move tag app-main
        if: steps.release.outputs.move_tag == 'true'
        # May fail: GITHUB_TOKEN may not always change refs (for example when the run changed the workflow
        # itself). The app reads build and commit from the release text, not from the tag.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PATCH "repos/$GH_REPO/git/refs/tags/app-main" -f sha="$GITHUB_SHA" -F force=true > /dev/null
  history:
    name: Version history (check and notes)
    # Version history, part 1 (read access only): check the IPA and write the release notes. On integ/main,
    # "publish" (build-N) and "release" (app-main) follow. Other branches and workflow_dispatch with
    # release_dry_run are a dry run; the notes then only appear in the job summary.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Player-ipa
      - name: Mode
        id: mode
        env:
          DRY: ${{ inputs.release_dry_run }}
        run: |
          mode=dry-run
          case "$GITHUB_REF" in refs/heads/integ|refs/heads/main) mode=publish ;; esac
          [ "$DRY" = true ] && mode=dry-run
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"
      # The secret IPA_DENYLIST only in runs on integ and main (the check code comes from the branch);
      # other branches run the same check without the extra list.
      - name: Check IPA (no keys, addresses, names)
        if: github.ref_name == 'integ' || github.ref_name == 'main'
        env:
          EXTRA_DENY: ${{ secrets.IPA_DENYLIST }}
        run: bash tools/check_ipa.sh Player.ipa
      - name: Check IPA (no keys, addresses, names; without the extra list)
        if: github.ref_name != 'integ' && github.ref_name != 'main'
        run: bash tools/check_ipa.sh Player.ipa
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          bash tools/release_notes.sh "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > notes.md
          { echo "## Version history: build-$GITHUB_RUN_NUMBER ($MODE)"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
          cat notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.mode.outputs.mode == 'publish'
        with:
          name: release-notes
          path: notes.md
          retention-days: 3
  publish:
    name: Publish build-N
    # Version history, part 2: release build-<run number> (= CFBundleVersion) with Player.ipa, only after the
    # IPA check. integ → prerelease, main → release ("Latest"). Write access only here.
    needs: [build, history]
    if: needs.history.outputs.mode == 'publish' && (github.ref == 'refs/heads/integ' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-history-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Player-ipa
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Release build-N
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          # Repeated run (same run number): the release is already there, nothing to do. A leftover
          # draft (aborted upload) counts as missing: delete it and create it again.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo "$tag already exists"; exit 0; fi
            echo "$tag is a draft: deleting it and creating it again"
            gh release delete "$tag" --yes
          fi
          if [ "$GITHUB_REF_NAME" = main ]; then
            flags=(--latest); title="Player build $GITHUB_RUN_NUMBER"
          else
            flags=(--prerelease --latest=false); title="Player build $GITHUB_RUN_NUMBER (integ)"
          fi
          if ! gh release create "$tag" Player.ipa --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"; then
            # GITHUB_TOKEN may not create some refs (for example when the run changed the workflow itself).
            # The build is fine; the release can be added locally afterwards.
            echo "::warning title=Release::$tag not created - add it locally: tools/backfill_releases.sh --publish $GITHUB_RUN_ID"
            echo "**$tag not created** - add it locally: \`tools/backfill_releases.sh --publish $GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          fi
